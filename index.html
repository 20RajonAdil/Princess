<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>From Adil to Princess</title>
<meta name="description" content="A little corner of the sky for Princess Mia, ruler of Kepler-23 and all things sparkly. Made by Adil.">
<meta name="theme-color" content="#14061f">
<meta name="color-scheme" content="dark">

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">

<meta property="og:type" content="website">
<meta property="og:title" content="From Adil to Princess">
<meta property="og:description" content="A little corner of the sky for Princess Mia, ruler of Kepler-23.">
<meta property="og:image" content="og-image.png">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Outfit:wght@300..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Shared SVG symbols -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="spark" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 0C13 7 17 11 24 12C17 13 13 17 12 24C11 17 7 13 0 12C7 11 11 7 12 0Z"/>
    </symbol>
    <symbol id="cat" viewBox="0 0 64 64">
      <path fill="currentColor" d="M12 30L10 8L26 18Q32 16 38 18L54 8L52 30Q58 50 32 55Q6 50 12 30Z"/>
      <path fill="#14061f" opacity=".85" d="M22 32a3 4.2 0 1 0 .01 0ZM42 32a3 4.2 0 1 0 .01 0Z"/>
      <path fill="#14061f" opacity=".85" d="M29.5 41h5l-2.5 3Z"/>
      <path fill="none" stroke="#14061f" stroke-opacity=".6" stroke-width="1.4" stroke-linecap="round" d="M26 46q6 4 12 0M8 40l11 2M8 47l11-2M56 40l-11 2M56 47l-11-2"/>
    </symbol>
    <symbol id="heart" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11Z"/>
    </symbol>
  </defs>
</svg>

<canvas id="sky" aria-hidden="true"></canvas>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

<main class="page">

  <header class="hero">
    <svg class="scene" viewBox="0 0 400 360" role="img" aria-label="A pink ringed planet wearing a golden crown, with a tiny cat moon circling it">
      <defs>
        <radialGradient id="planetGrad" cx="35%" cy="30%" r="80%">
          <stop offset="0" stop-color="#ffd2e6"/>
          <stop offset=".45" stop-color="#ff7eb6"/>
          <stop offset="1" stop-color="#5b1e8c"/>
        </radialGradient>
        <linearGradient id="crownGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffc48a"/>
          <stop offset="1" stop-color="#ff7eb6"/>
        </linearGradient>
        <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#7ff0e4" stop-opacity=".15"/>
          <stop offset=".5" stop-color="#ebd9ff"/>
          <stop offset="1" stop-color="#7ff0e4" stop-opacity=".15"/>
        </linearGradient>
        <radialGradient id="halo" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#ff7eb6" stop-opacity=".45"/>
          <stop offset="1" stop-color="#ff7eb6" stop-opacity="0"/>
        </radialGradient>
        <clipPath id="planetClip"><circle cx="200" cy="240" r="78"/></clipPath>
      </defs>

      <circle class="halo" cx="200" cy="240" r="150" fill="url(#halo)"/>

      <g transform="rotate(-14 200 240)">
        <ellipse cx="200" cy="240" rx="152" ry="34" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity=".55"/>
      </g>

      <circle cx="200" cy="240" r="78" fill="url(#planetGrad)"/>
      <g clip-path="url(#planetClip)">
        <g>
          <rect x="100" y="205" width="200" height="12" rx="6" fill="#fff" opacity=".18"/>
          <rect x="100" y="238" width="200" height="16" rx="8" fill="#5b1e8c" opacity=".25"/>
          <rect x="100" y="268" width="200" height="10" rx="5" fill="#fff" opacity=".14"/>
          <animateTransform attributeName="transform" type="translate" values="-26 0;26 0;-26 0" dur="14s" repeatCount="indefinite"/>
        </g>
        <circle cx="228" cy="214" r="9" fill="#5b1e8c" opacity=".3"/>
        <circle cx="176" cy="262" r="6" fill="#5b1e8c" opacity=".3"/>
      </g>

      <g transform="rotate(-14 200 240)">
        <path d="M48 240A152 34 0 0 0 352 240" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-linecap="round"/>
        <path id="orbitPath" d="M48 240A152 34 0 1 1 352 240A152 34 0 1 1 48 240" fill="none"/>
        <g class="moon">
          <use href="#cat" x="-16" y="-16" width="32" height="32" style="color:#7ff0e4"/>
          <animateMotion dur="9s" repeatCount="indefinite"><mpath href="#orbitPath"/></animateMotion>
        </g>
      </g>

      <g class="crown" transform="translate(140 96)">
        <path class="crown-line" pathLength="1" d="M4 62L12 18L36 40L60 6L84 40L108 18L116 62Z"/>
        <path class="crown-fill" d="M4 62L12 18L36 40L60 6L84 40L108 18L116 62Z"/>
        <rect class="crown-fill" x="4" y="62" width="112" height="9" rx="3"/>
        <circle class="gem" cx="12" cy="14" r="5"/>
        <circle class="gem" cx="60" cy="2" r="5.5"/>
        <circle class="gem" cx="108" cy="14" r="5"/>
      </g>

      <use class="tw tw1" href="#spark" x="58" y="70" width="18" height="18" style="color:#ebd9ff"/>
      <use class="tw tw2" href="#spark" x="332" y="118" width="24" height="24" style="color:#ffc48a"/>
      <use class="tw tw3" href="#spark" x="316" y="300" width="14" height="14" style="color:#7ff0e4"/>
      <use class="tw tw4" href="#spark" x="40" y="286" width="20" height="20" style="color:#ff7eb6"/>
    </svg>

    <p class="from">From Adil to Princess</p>
    <h1 class="name" aria-label="Mia">
      <span aria-hidden="true" style="--i:0">M</span><span aria-hidden="true" style="--i:1">i</span><span aria-hidden="true" style="--i:2">a</span>
    </h1>
    <p class="tagline">Ruler of Kepler-23 and all things sparkly</p>
  </header>

  <section class="stage" aria-label="Poems for Mia">

    <div class="portrait">
      <svg class="ring" viewBox="0 0 300 300" aria-hidden="true">
        <defs>
          <path id="ringPath" d="M150,150 m-124,0 a124,124 0 1,1 248,0 a124,124 0 1,1 -248,0"/>
          <linearGradient id="ringText" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffc48a"/>
            <stop offset="1" stop-color="#ff7eb6"/>
          </linearGradient>
        </defs>
        <text fill="url(#ringText)" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="17">
          <textPath href="#ringPath" textLength="772" lengthAdjust="spacing">Princess Mia • Ruler of Kepler-23 • Cat Empress • Keeper of Glitter •</textPath>
        </text>
      </svg>
      <div class="photo"><img src="assets/mia.jpg" alt="Princess Mia" width="900" height="898" decoding="async"></div>
    </div>

    <div class="card" id="card">
      <div class="poem" id="poemBox">
        <p class="poem-ghost" id="poemGhost" aria-hidden="true"></p>
        <p class="poem-live" id="poem" aria-hidden="true"></p>
        <p class="sr-only" id="poemSr" role="status"></p>
      </div>

      <p class="royal-title" id="titleBox">Princess of Kepler-23</p>

      <div class="controls">
        <button type="button" class="btn btn-main" id="newPoemBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#spark"/></svg>
          New poem
        </button>
        <button type="button" class="btn" id="catRainBtn">
          <svg viewBox="0 0 64 64" aria-hidden="true"><use href="#cat"/></svg>
          Cat rain
        </button>
        <button type="button" class="btn" id="sparkleBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#heart"/></svg>
          Sparkle burst
        </button>
      </div>

      <div class="meter">
        <div class="meter-row"><span>Sparkle level</span><strong>100%</strong></div>
        <div class="bar" role="progressbar" aria-label="Sparkle level" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
          <div class="fill"></div>
        </div>
      </div>
    </div>

    <p class="foot">Made with <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#heart"/></svg> by Adil</p>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
